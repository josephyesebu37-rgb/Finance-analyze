<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Finance AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-300 font-sans min-h-screen">
    <div id="app" class="max-w-4xl mx-auto p-4">
        <nav class="flex justify-between items-center py-6 border-b border-slate-800 mb-8">
            <div class="flex items-center gap-2">
                <i data-lucide="activity" class="text-cyan-400"></i>
                <h1 class="text-xl font-bold text-white tracking-tight">Quantum Finance AI</h1>
            </div>
            <button onclick="toggleLanguage()" class="bg-slate-800 px-4 py-2 rounded-lg text-sm border border-slate-700 hover:bg-slate-700 transition-all">
                <span id="langBtnText">Switch to తెలుగు</span>
            </button>
        </nav>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl mb-8">
            <div class="flex gap-2 mb-6">
                <input type="text" id="symbolInput" placeholder="Enter Symbol (e.g., AAPL, TSLA, BTC)" 
                    class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 w-full text-white focus:outline-none focus:border-cyan-500 transition-all">
                <button onclick="fetchStock()" id="fetchBtn" class="bg-cyan-500 text-slate-950 font-bold px-6 py-3 rounded-xl hover:bg-cyan-400 transition-all flex items-center gap-2">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="text-center py-10 border-t border-slate-800/50">
                <h2 id="displaySymbol" class="text-slate-500 text-xs uppercase tracking-[0.3em] mb-2">LIVE DATA FEED</h2>
                <div id="priceDisplay" class="text-6xl font-black text-white tracking-tighter mb-2">$0.00</div>
                <div id="changeDisplay" class="text-sm font-mono text-emerald-400">0.00%</div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl mb-8">
            <h3 class="text-cyan-400 font-bold mb-4 flex items-center gap-2">
                <i data-lucide="bot"></i> Gemini AI Analysis
            </h3>
            <div class="flex gap-2">
                <input type="text" id="aiQuery" placeholder="Ask AI about this market..." 
                    class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 w-full text-white focus:outline-none focus:border-cyan-500">
                <button onclick="askGemini()" class="bg-cyan-500 text-black px-4 py-2 rounded-xl font-bold">Ask</button>
            </div>
            <div id="aiResponse" class="mt-4 text-sm text-slate-400 italic"></div>
        </div>

        <footer class="mt-20 text-[10px] text-slate-600 text-center uppercase tracking-[0.2em] pb-10">
            <p id="disclaimerText">Disclaimer: Educational purposes only. Powered by Gemini 3.1 Pro & Alpha Vantage.</p>
        </footer>
    </div>

    <script>
        lucide.createIcons();
        let isTelugu = false;

        // మావా, ఇక్కడ చూడు! ఈ కీలను నేను నేరుగా ఇవ్వకుండా నెట్లిఫై కోసం సెట్ చేశాను.
        // నువ్వు నెట్లిఫై సెట్టింగ్స్ లో ఇవి ఇస్తే చాలు.
        const ALPHA_KEY = "ALPHA_KEY_PLACEHOLDER"; 
        const GEMINI_KEY = "GEMINI_KEY_PLACEHOLDER";

        function toggleLanguage() {
            isTelugu = !isTelugu;
            document.getElementById('langBtnText').innerText = isTelugu ? 'Switch to English' : 'Switch to తెలుగు';
            document.getElementById('symbolInput').placeholder = isTelugu ? 'కంపెనీ కోడ్ ఇవ్వండి (ఉదా: AAPL)' : 'Enter Symbol (e.g., AAPL, TSLA, BTC)';
            document.getElementById('disclaimerText').innerText = isTelugu ? 'నిరాకరణ: ఇది కేవలం విద్యా ప్రయోజనాల కోసం మాత్రమే.' : 'Disclaimer: Educational purposes only. Powered by Gemini 3.1 Pro & Alpha Vantage.';
        }

        async function fetchStock() {
            const symbol = document.getElementById('symbolInput').value.toUpperCase() || 'IBM';
            const btn = document.getElementById('fetchBtn');
            btn.innerHTML = '<div class="animate-spin h-5 w-5 border-2 border-slate-950 border-t-transparent rounded-full"></div>';

            try {
                // నెట్లిఫై లో కీ సెట్ అయ్యాక ఇది పనిచేస్తుంది
                const response = await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=${ALPHA_KEY}`);
                const data = await response.json();
                
                if (data["Global Quote"]) {
                    const price = parseFloat(data["Global Quote"]["05. price"]).toFixed(2);
                    const change = data["Global Quote"]["10. change percent"];
                    document.getElementById('displaySymbol').innerText = `${symbol} LIVE DATA`;
                    document.getElementById('priceDisplay').innerText = `$${price}`;
                    document.getElementById('changeDisplay').innerText = change;
                    document.getElementById('changeDisplay').className = change.includes('-') ? 'text-sm font-mono text-rose-500' : 'text-sm font-mono text-emerald-400';
                } else { alert('Limit reached!'); }
            } catch (error) { alert('Error fetching data!'); }
            btn.innerHTML = '<i data-lucide="search" class="w-5 h-5"></i>';
            lucide.createIcons();
        }

        async function askGemini() {
            const query = document.getElementById('aiQuery').value;
            const responseDiv = document.getElementById('aiResponse');
            responseDiv.innerText = isTelugu ? "ఆలోచిస్తున్నాను మావా..." : "Thinking...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: query }] }] })
                });
                const data = await response.json();
                responseDiv.innerText = data.candidates[0].content.parts[0].text;
            } catch (error) { responseDiv.innerText = "Error connecting to Gemini!"; }
        }
    </script>
</body>
</html>
